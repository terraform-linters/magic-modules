name: Sync fork
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: # Enables on-demand/manual triggering

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync ${{github.repository}}
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
